<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme River Visualization</title>
    <style>
        .chart-container {
            width: 100%;
            height: 80vh;
        }
        #legend {
            display: flex;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-right: 10px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <svg id="themeRiverChart"></svg>
    </div>
    <div>
        <label for="dimension-select">Select Dimension:</label>
        <select id="dimension-select">
            <option value="event">Event</option>
            <option value="object">Object</option>
            <option value="subject">Subject</option>
            <option value="sentence">Sentence</option>
            <option value="appears_in_article">Appears in Article</option>
            <option value="appears_in_knowledge_graph">Appears in Knowledge Graph</option>
            <option value="reference">Reference</option>
            <option value="revision">Revision</option>
            <option value="thread">Thread</option>
            <option value="bias_score">Bias Score</option>
            <option value="algorithm">Algorithm</option>
            <option value="analyst">Analyst</option>
        </select>
    </div>
    <div id="legend"></div>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="js/themeRiver.js"></script>
</body>
</html>
