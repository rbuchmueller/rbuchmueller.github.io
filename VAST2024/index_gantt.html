<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bias Evolution Area Chart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .chart-container {
            width: 100%;
            height: 100vh;
            overflow-x: auto;
            overflow-y: auto;
        }

        .tooltip {
            position: absolute;
            background-color: white;
            border: solid 1px #ccc;
            border-radius: 5px;
            padding: 5px;
            pointer-events: none;
            opacity: 0.9;
        }

        .tooltip.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <div id="ganttChartDiagram"></div>
    </div>

    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="js/gantt.js"></script>
</body>
</html>
